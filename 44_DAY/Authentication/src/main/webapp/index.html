<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>
    <style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    height: 100vh;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-container {
    background: #fff;
    padding: 30px;
    width: 350px;
    border-radius: 10px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

.login-container h2 {
    text-align: center;
    margin-bottom: 20px;
    color: #333;
}

.input-group {
    margin-bottom: 15px;
}

.input-group label {
    display: block;
    margin-bottom: 5px;
    font-size: 14px;
    color: #555;
}

.input-group input {
    width: 100%;
    padding: 10px;
    border-radius: 5px;
    border: 1px solid #ccc;
}

.input-group input:focus {
    outline: none;
    border-color: #667eea;
}

button {
    width: 100%;
    padding: 10px;
    background: #667eea;
    border: none;
    border-radius: 5px;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #5a67d8;
}

.register-link {
    margin-top: 15px;
    text-align: center;
    font-size: 14px;
}

.register-link a {
    color: #667eea;
    text-decoration: none;
}
    
    </style>
</head>
<body>

<div class="login-container">
    <h2>Login</h2>

    <form action="Loggedin" method="post">
        <div class="input-group">
            <label>Email</label>
            <input name="username" type="text" placeholder="Enter username" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input name="password" type="password" placeholder="Enter password" required>
        </div>

        <button type="submit">Login</button>

        <p class="register-link">
            Don’t have an account? <a href="#">Register</a>
        </p>
    </form>
</div>

</body>
</html>
